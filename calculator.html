<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav>
    <div class="logo">BMI Health Tracker</div>
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/calculator">Calculator</a>
        <a href="/history">History</a>
        <a href="/about">About</a>
    </div>
</nav>

<div class="container">

    <div class="card">
        <h1>BMI Calculator</h1>
        <p>Enter your details to calculate your Body Mass Index.</p>

        <form action="/calculate" method="POST">

            <label for="name">Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name" required>

            <label for="age">Age</label>
            <input type="number" id="age" name="age"
                   min="1" max="120"
                   placeholder="Enter your age" required>

            <label for="height">Height (cm)</label>
            <input type="number" id="height" name="height"
                   min="50" max="250" step="0.1"
                   placeholder="Example: 170" required>

            <label for="weight">Weight (kg)</label>
            <input type="number" id="weight" name="weight"
                   min="10" max="300" step="0.1"
                   placeholder="Example: 65" required>

            <button type="submit">Calculate BMI</button>

        </form>
    </div>

</div>

<footer>
    <p>© 2026 BMI Health Tracker</p>
</footer>

</body>
</html>
